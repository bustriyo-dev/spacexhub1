<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceman Crash - Player</title>
    <style>
        :root {
            --bg-dark: #090614;
            --panel-bg: #120c24;
            --card-bg: #1c1338;
            --space-purple: #7b2cbf;
            --space-cyan: #00f5ff;
            --space-yellow: #ffdf00;
            --neon-red: #ff0055;
            --neon-green: #00ff66;
            --text-main: #f1f0ff;
            --text-sub: #9a8cbf;
            --border-color: #2e1f54;
            --glow-cyan: rgba(0, 245, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .viewport-9-16 {
            width: 100vw; height: 177.78vw; max-height: 100vh; max-width: 56.25vh;
            display: flex; flex-direction: column; padding: 12px; gap: 10px;
            background: radial-gradient(circle at 50% 20%, #1a0b36 0%, #080410 100%);
            border: 1px solid var(--border-color); box-shadow: 0 0 50px rgba(0,0,0,0.95); position: relative; overflow-y: auto;
        }

        .notification-banner {
            display: none; position: absolute; top: 55px; left: 12px; right: 12px;
            background: linear-gradient(135deg, var(--space-cyan) 0%, #0088cc 100%); color: #000;
            padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 800; box-shadow: 0 0 20px var(--glow-cyan); z-index: 100;
        }

        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 12, 36, 0.85); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 10px; }
        .logo-title { font-size: 16px; font-weight: 900; color: var(--space-cyan); letter-spacing: 1px; }
        .balance-box { font-size: 13px; font-weight: 800; color: var(--neon-green); }

        .canvas-container {
            background: radial-gradient(circle at center, #1f1140 0%, #0b0518 100%);
            border: 1px solid var(--space-purple); border-radius: 10px; height: 210px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .live-overlay { position: relative; z-index: 2; text-align: center; pointer-events: none; }
        .live-mult { font-size: 52px; font-weight: 900; color: var(--space-cyan); text-shadow: 0 0 20px var(--glow-cyan); }
        .live-status { font-size: 12px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }

        .panel-card { background: rgba(28, 19, 56, 0.7); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .panel-title { font-size: 11px; font-weight: 800; color: var(--space-yellow); text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .input-group { display: flex; flex-direction: column; gap: 3px; }
        .input-group label { font-size: 9px; color: var(--text-sub); font-weight: bold; text-transform: uppercase; }
        .input-group input { background: #0d071b; border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }

        .btn { padding: 12px; border: none; border-radius: 6px; font-weight: 900; font-size: 13px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn-bet { background: linear-gradient(135deg, var(--neon-green) 0%, #00b34a 100%); color: #000; }
        .btn-bet:disabled { background: #2e1f54; color: #666; cursor: not-allowed; }
        .btn-cashout { background: linear-gradient(135deg, var(--space-yellow) 0%, #ccb100 100%); color: #000; }

        .table-container { flex: 1; max-height: 140px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; background: #0c0618; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th { background: rgba(30, 19, 60, 0.9); color: var(--text-sub); padding: 6px 5px; text-align: left; position: sticky; top: 0; }
        td { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--space-purple); }
    </style>
</head>
<body>
    <div class="viewport-9-16">
        <div class="notification-banner" id="notifBanner">📢 <span id="notifText">Pesan Bandar</span></div>

        <div class="header">
            <div class="logo-title">👨‍🚀 SPACEMAN</div>
            <div class="balance-box">Saldo: Rp <span id="userBalance">100.000</span></div>
        </div>

        <div class="canvas-container">
            <canvas id="spaceCanvas"></canvas>
            <div class="live-overlay">
                <div class="live-mult" id="multDisplay">1.00x</div>
                <div class="live-status" id="statusDisplay">MENUNGGU...</div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-title">Panel Taruhan</div>
            <div class="controls-grid">
                <div class="input-group">
                    <label>Taruhan (Rp)</label>
                    <input type="number" id="betAmount" value="10000" step="1000">
                </div>
                <div class="input-group">
                    <label>Auto Cashout (x)</label>
                    <input type="number" id="autoCashout" value="2.00" step="0.1">
                </div>
            </div>
            <button id="actionBtn" class="btn btn-bet" style="margin-top: 4px;">PASANG TARUHAN</button>
        </div>

        <div class="panel-card" style="flex:1; min-height: 0;">
            <div class="panel-title">Taruhan Pemain Lain</div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Pemain</th><th>Taruhan</th><th>Status</th></tr></thead>
                    <tbody id="botTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('mahjong_crash_channel');
        let balance = 100000, currentBet = 0, isBetPlaced = false, isCashedOut = false;
        let gameState = 'COUNTDOWN', currentMultiplier = 1.00, bots = [];

        const multDisplay = document.getElementById('multDisplay');
        const statusDisplay = document.getElementById('statusDisplay');
        const actionBtn = document.getElementById('actionBtn');
        const userBalanceEl = document.getElementById('userBalance');
        const botTableBody = document.getElementById('botTableBody');
        const notifBanner = document.getElementById('notifBanner');
        const notifText = document.getElementById('notifText');

        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const stars = Array.from({ length: 30 }, () => ({ x: Math.random() * 300, y: Math.random() * 210, r: Math.random() * 1.5 + 0.5, alpha: Math.random() }));
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.y += 0.4; if (s.y > canvas.height) s.y = 0;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.alpha})`; ctx.fill();
            });
            if (gameState === 'RUNNING' || gameState === 'CRASHED') {
                const progress = Math.min((currentMultiplier - 1) / 4, 1);
                const startX = 20, startY = canvas.height - 20;
                const endX = canvas.width * 0.75 * progress + 20;
                const endY = canvas.height - (canvas.height * 0.65 * progress) - 20;
                ctx.beginPath(); ctx.moveTo(startX, startY); ctx.quadraticCurveTo(endX / 2, canvas.height - 10, endX, endY);
                ctx.strokeStyle = gameState === 'CRASHED' ? '#ff0055' : '#00f5ff'; ctx.lineWidth = 3; ctx.stroke();
                ctx.beginPath(); ctx.arc(endX, endY, 7, 0, Math.PI * 2);
                ctx.fillStyle = gameState === 'CRASHED' ? '#ff0055' : '#ffdf00'; ctx.fill();
            }
            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        channel.onmessage = (event) => {
            const data = event.data;
            if (data.type === 'SYNC_STATE') {
                gameState = data.state;
                currentMultiplier = data.multiplier;

                if (gameState === 'COUNTDOWN') {
                    // Perbaikan: Sinkronisasi waktu mundur dari broadcast host
                    statusDisplay.textContent = `SIAP TERBANG: ${data.timer}s`;
                    multDisplay.textContent = '1.00x'; 
                    multDisplay.style.color = 'var(--space-cyan)';
                    
                    if (!isBetPlaced) { 
                        actionBtn.disabled = false; 
                        actionBtn.className = 'btn btn-bet'; 
                        actionBtn.textContent = 'PASANG TARUHAN'; 
                    }
                } else if (gameState === 'RUNNING') {
                    statusDisplay.textContent = 'TERBANG...';
                    multDisplay.textContent = currentMultiplier.toFixed(2) + 'x';
                    if (isBetPlaced && !isCashedOut) {
                        actionBtn.disabled = false; 
                        actionBtn.className = 'btn btn-cashout';
                        actionBtn.textContent = `CASHOUT (Rp ${Math.floor(currentBet * currentMultiplier).toLocaleString('id-ID')})`;
                        const autoVal = parseFloat(document.getElementById('autoCashout').value);
                        if (autoVal && currentMultiplier >= autoVal) doCashout();
                    }
                } else if (gameState === 'CRASHED') {
                    statusDisplay.textContent = 'TABRAKAN!';
                    multDisplay.textContent = data.crashPoint.toFixed(2) + 'x';
                    multDisplay.style.color = 'var(--neon-red)';
                    actionBtn.disabled = true; 
                    actionBtn.className = 'btn btn-bet'; 
                    actionBtn.textContent = 'RONDE SELESAI';
                }
            } else if (data.type === 'BOTS_UPDATE' || data.bots) {
                bots = data.bots || []; 
                renderBots();
            } else if (data.type === 'RESET_ROUND') {
                isBetPlaced = false; 
                isCashedOut = false; 
                currentBet = 0;
            } else if (data.type === 'HOST_NOTIFICATION') {
                notifText.textContent = data.message; 
                notifBanner.style.display = 'block';
                setTimeout(() => { notifBanner.style.display = 'none'; }, 4000);
            }
        };

        actionBtn.addEventListener('click', () => {
            if (gameState === 'COUNTDOWN' && !isBetPlaced) {
                const betVal = parseInt(document.getElementById('betAmount').value);
                if (betVal > balance || betVal <= 0) { alert('Saldo tidak cukup!'); return; }
                balance -= betVal; currentBet = betVal; isBetPlaced = true;
                userBalanceEl.textContent = balance.toLocaleString('id-ID');
                actionBtn.disabled = true; actionBtn.textContent = 'MENUNGGU...';
                channel.postMessage({ type: 'PLAYER_BET', amount: betVal });
            } else if (gameState === 'RUNNING' && isBetPlaced && !isCashedOut) {
                doCashout();
            }
        });

        function doCashout() {
            isCashedOut = true;
            const winAmt = Math.floor(currentBet * currentMultiplier);
            balance += winAmt; userBalanceEl.textContent = balance.toLocaleString('id-ID');
            actionBtn.disabled = true; actionBtn.className = 'btn btn-bet'; actionBtn.textContent = `BERHASIL (+Rp ${winAmt.toLocaleString('id-ID')})`;
            channel.postMessage({ type: 'PLAYER_CASHOUT', amount: winAmt, multiplier: currentMultiplier });
        }

        function renderBots() {
            botTableBody.innerHTML = '';
            bots.forEach(b => {
                const tr = document.createElement('tr');
                let statusHtml = `<span style="color: var(--text-sub)">Bertaruh...</span>`;
                if (b.cashedOut) statusHtml = `<span style="color: var(--neon-green); font-weight:bold;">@ ${b.cashoutMult ? b.cashoutMult.toFixed(2) : currentMultiplier.toFixed(2)}x</span>`;
                else if (gameState === 'CRASHED') statusHtml = `<span style="color: var(--neon-red); font-weight:bold;">Crashed</span>`;
                tr.innerHTML = `<td><strong>${b.name}</strong></td><td>Rp ${b.bet.toLocaleString('id-ID')}</td><td>${statusHtml}</td>`;
                botTableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
